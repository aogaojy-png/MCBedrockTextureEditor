plugins {
    id 'com.android.application'
}

android {
    namespace 'com.k9t2.mcpackmaker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.k9t2.mcpackmaker'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0-bedrock'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
