<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC 基岩版材质编辑器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 MC 基岩版材质编辑器</h1>
        <p class="subtitle">在手机上直接创建、编辑和生成 Minecraft 基岩版材质包</p>

        <div class="features">
            <div class="feature-card">
                <span>📱</span>
                <h3>全手机操作</h3>
                <p>无需电脑，直接在手机上完成所有操作</p>
            </div>
            <div class="feature-card">
                <span>🎯</span>
                <h3>多种纹理类型</h3>
                <p>支持物品、方块、生物、UI、天空纹理替换</p>
            </div>
            <div class="feature-card">
                <span>📦</span>
                <h3>子包支持</h3>
                <p>支持 Subpacks 导入与生成</p>
            </div>
            <div class="feature-card">
                <span>⚡</span>
                <h3>一键生成</h3>
                <p>自动生成 .mcpack 文件，直接导入 Minecraft</p>
            </div>
        </div>

        <div class="download-section">
            <a href="https://github.com/aogaojy-png/MCBedrockTextureEditor/releases" class="btn">📥 下载 APK</a>
            <a href="https://github.com/aogaojy-png/MCBedrockTextureEditor" class="btn btn-secondary">💻 查看源码</a>
        </div>

        <div class="footer">
            <p>开源协议：AGPL-3.0</p>

        </div>
